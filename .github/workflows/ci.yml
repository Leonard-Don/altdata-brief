name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # CJK fonts must be installed BEFORE matplotlib is first imported so the
      # font manager picks up Noto Sans CJK during its initial cache build.
      # Without this, test_cjk_rendering fails with glyph-missing warnings and
      # downstream charts render Chinese as tofu.
      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -fv

      - name: uv sync
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src tests

      - name: pytest
        run: uv run pytest -q

      # v0.4 end-to-end smoke: rsyncs committed fixture summaries into a
      # scratch dir simulating ALTDATA_BRIEF_SOURCE_ROOT, then runs
      # validate + generate under --source-mode public. Uses FIXTURE
      # mode so the CI doesn't depend on access to the maintainer's
      # upstream repos. The local `bash scripts/smoke_e2e.sh` runs the
      # same script against REAL upstream data.
      - name: smoke_e2e against committed fixtures
        run: SMOKE_FIXTURE=1 bash scripts/smoke_e2e.sh
