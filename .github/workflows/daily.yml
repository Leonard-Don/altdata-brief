name: Daily Brief

# Beijing time 09:00 = 01:00 UTC; trading days Mon-Fri.
#
# v0.11 plumbing:
#   - This workflow checks out the upstream public artifacts required by
#     `--source-mode public` and fails loudly when a source summary is missing.
#   - Scheduled runs generate and dry-run the gh-pages publish plan only.
#   - Manual runs can opt in to a real gh-pages push via the `publish` input;
#     the publish step delegates to the CLI publisher so Atom, EN siblings,
#     weekly digests, and monthly digests share the local publish contract.
on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push generated artifacts to gh-pages after generation"
        required: false
        type: boolean
        default: false

env:
  # Tell the brief generator where the upstream checkouts will land.
  ALTDATA_BRIEF_SOURCE_ROOT: ${{ github.workspace }}/sources

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- Source-repo public-summary checkouts -----
      # Each upstream repo only needs the `data/public/` directory at
      # the surface — but `actions/checkout` doesn't support sparse
      # checkouts of arbitrary paths, so we clone shallow (depth=1).
      - name: Checkout super-pricing-system (public summary only)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Don/super-pricing-system
          path: sources/PycharmProjects/super-pricing-system
          fetch-depth: 1
          sparse-checkout: |
            data/public
          sparse-checkout-cone-mode: false

      - name: Checkout index-inclusion-research (public summary only)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Don/index-inclusion-research
          path: sources/index-inclusion-research
          fetch-depth: 1
          sparse-checkout: |
            data/public
          sparse-checkout-cone-mode: false

      - name: Checkout quant-trading-system (public summary only)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Don/quant-trading-system
          path: sources/PycharmProjects/quant-trading-system
          fetch-depth: 1
          sparse-checkout: |
            data/public
          sparse-checkout-cone-mode: false

      - name: Checkout ETF 512400 (public snapshot only)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Don/etf-512400
          path: sources/ETF 512400
          fetch-depth: 1
          sparse-checkout: |
            src/data/liveSnapshot.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # CJK fonts must be installed BEFORE matplotlib is first imported so
      # the font manager picks up Noto Sans CJK during its initial cache
      # build. Without this, charts render Chinese labels as tofu.
      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -fv

      - run: uv sync

      - name: Inspect resolved source paths
        run: |
          echo "Workspace root: ${{ github.workspace }}"
          echo "Source root (sees by adapters): ${ALTDATA_BRIEF_SOURCE_ROOT}"
          find "${ALTDATA_BRIEF_SOURCE_ROOT}" -name '*_summary.json' -maxdepth 6 || true

      - name: Validate upstream public summaries
        run: uv run altdata-brief validate --source-mode public --strict || test "$?" -eq 1

      - name: Generate brief (public-summary mode)
        run: uv run altdata-brief generate --source-mode public --verbose

      # Fetch the published branch into a local ref when it already exists.
      # The CLI publisher intentionally reasons over local git refs; without
      # this fetch a GitHub Actions checkout of `main` would mistake an existing
      # remote gh-pages branch for a first publish and try to create an orphan.
      - name: Prepare gh-pages branch reference
        run: git fetch origin gh-pages:gh-pages || true

      - name: Plan gh-pages publish payload
        if: github.event_name != 'workflow_dispatch' || inputs.publish != true
        run: |
          set -euo pipefail
          DATE=$(date -u +"%Y-%m-%d")
          uv run altdata-brief publish --date "$DATE" --dry-run --no-push

      - name: Publish to gh-pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GIT_USER_NAME: altdata-brief-bot
          GIT_USER_EMAIL: bot@altdata-brief.local
        run: |
          set -euo pipefail
          DATE=$(date -u +"%Y-%m-%d")
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          uv run altdata-brief publish --date "$DATE"
