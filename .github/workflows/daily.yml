name: Daily Brief

# Beijing time 09:00 = 01:00 UTC; trading days Mon-Fri.
#
# v0.3 plumbing:
#   - This workflow now checks out the upstream source repos (super-pricing
#     and index-inclusion-research) and reads their `data/public/*_summary.json`
#     artifacts.
#   - `--source-mode public` forces the adapters to only read public summaries
#     (no cache fallback), so the workflow fails loudly if a summary is missing
#     instead of silently emitting an empty brief.
#   - Publish step is still a TEMPLATE — running on a public fork requires the
#     upstream repos to be public or for the workflow to have read access to
#     their checkouts. The maintainer reviews each push to gh-pages until
#     paid distribution begins.
on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

env:
  # Tell the brief generator where the upstream checkouts will land.
  CN_ALTDATA_BRIEF_SOURCE_ROOT: ${{ github.workspace }}/sources

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----- Source-repo public-summary checkouts -----
      # Each upstream repo only needs the `data/public/` directory at
      # the surface — but `actions/checkout` doesn't support sparse
      # checkouts of arbitrary paths, so we clone shallow (depth=1).
      - name: Checkout super-pricing-system (public summary only)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Don/super-pricing-system
          path: sources/PycharmProjects/super-pricing-system
          fetch-depth: 1
          sparse-checkout: |
            data/public
          sparse-checkout-cone-mode: false

      - name: Checkout index-inclusion-research (public summary only)
        uses: actions/checkout@v4
        with:
          repository: Leonard-Don/index-inclusion-research
          path: sources/index-inclusion-research
          fetch-depth: 1
          sparse-checkout: |
            data/public
          sparse-checkout-cone-mode: false
        continue-on-error: true  # index-inclusion-research summary still WIP

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # CJK fonts must be installed BEFORE matplotlib is first imported so
      # the font manager picks up Noto Sans CJK during its initial cache
      # build. Without this, charts render Chinese labels as tofu.
      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -fv

      - run: uv sync

      - name: Inspect resolved source paths
        run: |
          echo "Workspace root: ${{ github.workspace }}"
          echo "Source root (sees by adapters): ${CN_ALTDATA_BRIEF_SOURCE_ROOT}"
          find "${CN_ALTDATA_BRIEF_SOURCE_ROOT}" -name '*_summary.json' -maxdepth 6 || true

      - name: Validate upstream public summaries
        run: uv run cn-altdata-brief validate --source-mode public

      - name: Generate brief (public-summary mode)
        run: uv run cn-altdata-brief generate --source-mode public --verbose

      # Publish to gh-pages is still a TEMPLATE — disable by default until
      # the maintainer flips a repo secret or workflow input on.
      - name: Publish to gh-pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
        env:
          GIT_USER_NAME: cn-altdata-brief-bot
          GIT_USER_EMAIL: bot@cn-altdata-brief.local
        run: |
          set -e
          DATE=$(date -u +"%Y-%m-%d")
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages || git checkout -b gh-pages
          mkdir -p briefs
          cp output/briefs/${DATE}.md briefs/
          cp output/briefs/index.md briefs/index.md
          cp output/feed.xml feed.xml
          if [ -d output/charts/${DATE} ]; then
            mkdir -p charts
            cp -R output/charts/${DATE} charts/
          fi
          git add briefs charts feed.xml
          git commit -m "auto: brief ${DATE}" || echo "nothing to commit"
          git push origin gh-pages
