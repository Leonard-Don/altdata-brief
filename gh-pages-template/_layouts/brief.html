<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="alternate" type="application/rss+xml" title="CN AltData Brief RSS"
        href="{{ '/feed.xml' | relative_url }}">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      line-height: 1.65;
      color: #1f2328;
    }
    header, footer { color: #57606a; font-size: 0.9rem; }
    header a { color: #0969da; text-decoration: none; }
    img { max-width: 100%; height: auto; border: 1px solid #d0d7de; border-radius: 6px; }
    h1, h2 { color: #1f2328; border-bottom: 1px solid #d0d7de; padding-bottom: 0.3rem; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.3rem; margin-top: 2rem; }
    pre, code { background: #f6f8fa; border-radius: 4px; }
    blockquote { border-left: 4px solid #d0d7de; color: #57606a; padding-left: 1rem; margin-left: 0; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #d0d7de; padding: 6px 12px; }
    th { background: #f6f8fa; }
    hr { border: none; border-top: 1px solid #d0d7de; margin: 2rem 0; }
  </style>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">← 全部简报 / All briefs</a>
    &nbsp;·&nbsp;
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/Leonard-Don/cn-altdata-brief">GitHub</a>
  </header>
  <hr>
  <main>
    {{ content }}
  </main>
  <hr>
  <footer>
    <p>
      Generated by
      <a href="https://github.com/Leonard-Don/cn-altdata-brief">cn-altdata-brief</a>
      · MIT-licensed · all data sourced from 6 underlying quant projects.
    </p>
  </footer>
</body>
</html>
