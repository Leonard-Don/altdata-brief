[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-altdata-brief"
version = "0.5.0"
description = "Daily research brief synthesizing alt-data signals from a portfolio of 6 quant projects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Tang Zihan" }]
keywords = ["alt-data", "research-brief", "quantitative", "china-equity", "newsletter"]
dependencies = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "rich>=13.7",
]

[project.scripts]
cn-altdata-brief = "cn_altdata_brief.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cn_altdata_brief = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
