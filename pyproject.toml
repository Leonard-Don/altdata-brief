[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "altdata-brief"
version = "0.11.0"
description = "Daily research brief synthesizing alt-data signals from 4 public multi-market source adapters (bilingual CN/EN)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Leonard-Don" }]
keywords = ["alt-data", "research-brief", "quantitative", "multi-market", "newsletter"]
dependencies = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "rich>=13.7",
]

[project.scripts]
altdata-brief = "altdata_brief.cli:main"
cn-altdata-brief = "altdata_brief.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]
llm = [
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
altdata_brief = ["py.typed", "llm/industry_mapping.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
